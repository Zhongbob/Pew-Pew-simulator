<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Join Game</title>
  <link rel="stylesheet" href="style1.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #000;
      margin: 0;
      min-height: 100vh;
    }
    .header {
      min-height: 0;
      width: 100%;
      background: none;
      position: relative;
    }
    .container {
      text-align: center;
      background: rgba(20, 20, 20, 0.95);
      padding: 2.5rem 2rem;
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.7);
      color: #fff;
      min-width: 320px;
      max-width: 400px;
      margin: 60px auto 0 auto;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 2rem;
      letter-spacing: 1px;
      color: #00ffe7;
      text-shadow: 0 2px 8px rgba(0,255,231,0.12);
    }
    input {
      padding: 0.7rem;
      width: 70%;
      margin-bottom: 1rem;
      border: 1px solid #333;
      border-radius: 8px;
      background: #111;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border 0.2s;
    }
    input:focus {
      border: 1.5px solid #00ffe7;
    }
    button, a.option {
      background-color: #222;
      color: #00ffe7;
      text-decoration: none;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0,255,231,0.08);
      transition: background 0.2s, color 0.2s;
      padding: 0.7rem 1.5rem;
      margin: 0.7rem 0.5rem;
      display: inline-block;
      min-width: 120px;
    }
    button:hover, a.option:hover {
      background-color: #00ffe7;
      color: #222;
    }
    .gamemode-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 1.2rem;
      margin-bottom: 1.2rem;
    }
    #message {
      margin-top: 1.5rem;
      font-size: 1.1rem;
      min-height: 1.2em;
      color: #00ffe7;
      font-weight: 500;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <section class="header">
    <nav>
      <a href="index.html">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS8q8De3gU3-A9YxRr6s7pRrD0QflRZXC6ZAA&s" alt="Logo" class="logo">
      </a>
      <ul>
        <li><a href="index.html">HOME</a></li>
        <li><a href="page2.html">RULES</a></li>
        <li><a href="page1.html">PLAY</a></li>
      </ul>
    </nav>
  </section>
  <div class="container">
    <h1>Choose an Option</h1>
    <input type="text" id="clientIdInput" placeholder="Enter Client ID">
    <button id="saveBtn">Save Client ID</button>
    <a class="option" href="https://codepen.io/yourusername/pen/xyz456">Join a Room</a>
    <div class="gamemode-row">
      <button class="option" id="freeplayBtn">Freeplay Gamemode</button>
      <button class="option" id="survivalBtn">Survival Gamemode</button>
    </div>
    <p id="message"></p>
  </div>
  <script src="joinGame.js"></script>
</body>
</html>
